                    <button className="sp-btn secondary t-body-md" onClick={() => setParty(ps => ps.filter(x => x.id !== p.id))}>Cancel</button>
                  } />
                  <div className="sp-div" />
                </React.Fragment>
              ))}
            </div>
            {callControls()}
          </div>
          <button className="sp-btn danger t-body-md" style={{ width: 'calc(100% - 24px)' }} onClick={() => endCall()}>End</button>
        </div>
      );
    }
    if (isConference) {
      const people = [caller, ...connectedParty, ME];
      const first = (n) => n.split(' ')[0];
      const names = [caller, ...connectedParty].map(p => p.unknown ? p.name : first(p.name)).join(', ') + ', & you';
      return (
        <div className="sp-main" style={{ padding: 20, gap: 20, alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ flex: '1 0 0', width: '100%', display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ display: 'flex', alignItems: 'center' }}>
                {people.map((p, i) => (
                  <div key={p.id} style={{ marginRight: i < people.length - 1 ? -8 : 0 }}>
                    <Avatar p={p} size={48} color={i === 0 ? (p.unknown ? '#8D99AE' : '#B23C69') : p.color} />
                  </div>
                ))}
              </div>
              <span className="t-title-md" style={{ textAlign: 'center' }}>{names}</span>
              <button className="sp-link t-body-md" onClick={() => setCallView('people')}>
                {people.length} people <Ico n="chevron-right-blue" />
              </button>
            </div>
            {callControls()}
          </div>
          <button className="sp-btn danger full t-body-md" onClick={() => endCall('Call ended for everyone')}>End Call for Everyone</button>
          <button className="sp-btn secondary full t-body-md" onClick={() => endCall('You left the call')}>Leave Call</button>
        </div>
      );
    }
    // Single call (known or unknown)
    return (
      <div className="sp-main" style={{ padding: '32px 20px', gap: 20, alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', justifyContent: 'center' }}>
          <Avatar p={caller} size={48} color={caller.unknown ? '#8D99AE' : '#B23C69'} />
          <span className="t-title-md">{caller.name}</span>
          <div className="t-body-md" style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', textAlign: 'center' }}>
            {caller.unknown ? <span>{caller.location ? `${caller.location} · Not in contacts` : 'Not in contacts'}</span> : <>
              {caller.phone && <span>{caller.phone}</span>}
              {caller.company && <span>{caller.company}</span>}
            </>}
          </div>
          {!caller.unknown && caller.kind === 'contact' && (
            <button className="sp-link t-body-md" onClick={() => setCallView('details')}>
              Contact Details <Ico n="chevron-right-blue" />
            </button>
          )}
        </div>
        {callControls()}
        {caller.unknown && (
          <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 16, padding: 16, borderRadius: 4, border: '1px solid #5F6475', background: 'rgba(255,255,255,0.1)' }}>
            <span className="t-body-md">Who is this?</span>
            {whoMode === 'new' ? (
              <form style={{ display: 'flex', flexDirection: 'column', gap: 8 }}
                onSubmit={e => { e.preventDefault(); if (newContactName.trim()) identifyCaller({ id: 'new-' + Date.now(), name: newContactName.trim(), company: '' }, 'new'); }}>
                <div className="sp-field" style={{ height: 36 }}>
                  <input value={newContactName} autoFocus placeholder="Contact name" aria-label="New contact name" onChange={e => setNewContactName(e.target.value)} />
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button type="submit" className="sp-btn primary t-body-md" disabled={!newContactName.trim()}>Save Contact</button>
                  <button type="button" className="sp-btn accept-plain t-body-md" onClick={() => setWhoMode(null)}>Cancel</button>
                </div>
              </form>
            ) : whoMode === 'link' ? (
              <div className="sp-scroll" style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 150, overflowY: 'auto' }} role="listbox" aria-label="Link to existing contact">
                {CONTACTS.slice(1).map(ct => (
                  <button key={ct.id} role="option" className="sp-btn accept-plain t-body-md" style={{ justifyContent: 'flex-start', gap: 8, border: 'none' }}
                    onClick={() => identifyCaller(ct, 'link')}>
                    <Avatar p={ct} size={24} color="#B23C69" /><span>{ct.name}</span><span style={{ color: '#AEB7C6' }}>{ct.company}</span>
                  </button>
                ))}
                <button className="sp-link t-body-md" style={{ alignSelf: 'flex-start' }} onClick={() => setWhoMode(null)}>Cancel</button>
              </div>
            ) : (
              <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
                <button className="sp-btn secondary t-body-md" onClick={() => setWhoMode('new')}>New Contact</button>
                <button className="sp-btn secondary t-body-md" onClick={() => setWhoMode('link')}>Link to Existing</button>
              </div>
            )}
          </div>
        )}
        <button className="sp-btn danger full t-body-md" onClick={() => endCall()}>End</button>
      </div>
    );
  };

  const renderInCallKeypad = () => (
    <div className="sp-main" style={{ padding: 20, gap: 32, alignItems: 'center' }}>
      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div className="sp-field">
          <input value={dtmf} readOnly placeholder="" />
          {dtmf && <button className="sp-icon-btn" onClick={() => setDtmf('')} title="Clear"><Ico n="clear" /></button>}
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
        <Keypad onKey={k => setDtmf(v => v + k)} />
        <button className="sp-link t-body-md" style={{ color: '#fff' }} onClick={() => setCallView('main')}>Hide keypad</button>
      </div>
    </div>
  );

  const renderPeople = () => {
    const contacts = [{ ...caller, isCaller: true }, ...connectedParty.filter(p => p.kind !== 'user')];
    const users = connectedParty.filter(p => p.kind === 'user');
    const remove = (p) => {
      if (p.isCaller) { endCall(`${p.name} removed — call ended`); return; }
      setParty(ps => ps.filter(x => x.id !== p.id));
      if (connectedParty.length <= 1) setCallView('main');
    };
    return (
      <div className="sp-main" style={{ padding: 20, gap: 20, alignItems: 'center' }}>
        <BackLink onClick={() => setCallView('main')} />
        <div className="sp-scroll" style={{ flex: '1 0 0', width: '100%', display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
            <span className="t-accent-sm">Contacts ({contacts.length})</span>
            {contacts.map(p => (
              <PartyRow key={p.id} p={p} color={p.isCaller ? (p.unknown ? '#8D99AE' : '#B23C69') : p.color}
                meta={['Connected', fmt(p.isCaller ? callTimer : callTimer - p.since)]}
                right={<button className="sp-btn secondary t-body-md" onClick={() => remove(p)}>Remove</button>} />
            ))}
          </div>
          <div className="sp-div" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
            <span className="t-accent-sm">Users ({users.length + 1})</span>
            {users.map(p => (
              <React.Fragment key={p.id}>
                <PartyRow p={p} padding="8px 0 8px 8px" meta={['Connected', fmt(callTimer - p.since)]}
                  right={<button className="sp-btn secondary t-body-md" onClick={() => remove(p)}>Remove</button>} />
                <div className="sp-div" />
              </React.Fragment>
            ))}
            <div style={{ padding: 8 }}>
              <PartyRow p={{ ...ME, name: `${ME.name} (you)` }} color={ME.color} padding={0} meta={['Connected', fmt(callTimer)]} />
            </div>
            <div className="sp-div" />
          </div>
        </div>
        <button className="sp-btn secondary full t-body-md" onClick={() => { setAddTab('extensions'); setAddFilter('users'); setAddSearch(''); setCallView('add'); }}>Add Someone</button>
      </div>
    );
  };

  // ── Add someone ──
  const renderAdd = () => {
    const q = addSearch.trim().toLowerCase();
    const onCall = new Set(party.map(p => p.id));
    const users = USERS.filter(u => !onCall.has(u.id) && (!q || u.name.toLowerCase().includes(q) || u.title.toLowerCase().includes(q) || u.ext.includes(q)));
    const queues = QUEUES.filter(x => !q || x.name.toLowerCase().includes(q));
    return (
      <div className="sp-main" style={{ padding: 16, gap: 16, overflow: 'hidden' }}>
        <BackLink onClick={() => setCallView('main')} />
        <Seg value={addTab} onChange={setAddTab}
          options={[{ id: 'extensions', label: 'Extensions' }, { id: 'keypad', label: 'Keypad' }]} />
        {addTab === 'keypad' ? (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
            <div className="sp-field">
              <input value={addNumber} placeholder="Enter a number" autoFocus onChange={e => setAddNumber(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && addNumber.trim()) addParticipant(contactFromNumber(addNumber.trim())); }} />
              {addNumber && <button className="sp-icon-btn" onClick={() => setAddNumber('')} title="Clear"><Ico n="clear" /></button>}
            </div>
            <Keypad onKey={k => setAddNumber(v => v + k)}>
              <button className="sp-key call" style={{ gridColumn: 2 }} disabled={!addNumber.trim()} title="Add to call"
                onClick={() => addParticipant(contactFromNumber(addNumber.trim()))}>
                <Ico n={addNumber.trim() ? 'call-enabled' : 'call-disabled'} />
              </button>
            </Keypad>
          </div>
        ) : <>
          <FilterRow filter={addFilter} onFilter={setAddFilter} search={addSearch} onSearch={setAddSearch} />
          <div className="sp-scroll" style={{ flex: 1, width: '100%' }}>
            {addFilter === 'users'
              ? <ListWithDividers items={users} render={u => (
                  <UserRow u={u} right={
                    <button className="sp-row-call" title={`Add ${u.name}`} onClick={() => addParticipant(u)}><Ico n="row-call" /></button>
                  } />
                )} />
              : <ListWithDividers items={queues} render={x => (
                  <QueueRow q={x} right={
                    <button className="sp-row-call" title={`Add ${x.name}`} onClick={() => addParticipant({ ...x, initials: x.name.split(' ').map(w => w[0]).join('').slice(0, 2) })}><Ico n="row-call" /></button>
                  } />
                )} />}
          </div>
        </>}
      </div>
    );
  };

  // ── Transfer ──
  const renderTransfer = () => {
    if (transferTarget) {
      const t = transferTarget;
      return (
        <div className="sp-main" style={{ padding: 20 }}>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'flex-start', width: '100%' }}>
            <BackLink onClick={() => setTransferTarget(null)} />
            <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', justifyContent: 'center' }}>
              <Avatar p={t} size={48} color="#8D99AE" />
              <span className="t-title-md">{t.name}</span>
              <div className="sp-line" style={{ gap: 12 }}>
                <span className="t-body-sm">Ext. {t.ext}</span>
                <span className="t-body-sm">{t.title}</span>
              </div>
              <StatusDot status={t.status} />
            </div>
            <div style={{ display: 'flex', gap: 16, width: '100%', justifyContent: 'center' }}>
              <button className="sp-btn secondary t-body-md" style={{ flex: 1 }} onClick={() => startConsult(t)}>Consult First</button>
              <button className="sp-btn primary t-body-md" style={{ flex: 1 }} onClick={doTransfer}>Transfer Now</button>
            </div>
          </div>
        </div>
      );
    }
    const q = transferSearch.trim().toLowerCase();
    const users = USERS.filter(u => !q || u.name.toLowerCase().includes(q) || u.title.toLowerCase().includes(q) || u.ext.includes(q));
    const queues = QUEUES.filter(x => !q || x.name.toLowerCase().includes(q));
    const numberOk = transferNumber.trim().length > 0;
    return (
      <div className="sp-main" style={{ padding: 20, overflow: 'hidden' }}>
        <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start', width: '100%' }}>
          <BackLink onClick={() => setCallView('main')} />
          <Seg value={transferTab} onChange={setTransferTab}
            options={[{ id: 'extensions', label: 'Extensions' }, { id: 'keypad', label: 'Keypad' }]} />
          {transferTab === 'keypad' ? (
            <div style={{ flex: 1, width: '100%', display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
              <div className="sp-field">
                <input value={transferNumber} placeholder="Enter a number" autoFocus onChange={e => setTransferNumber(e.target.value)} />
                {transferNumber && <button className="sp-icon-btn" onClick={() => setTransferNumber('')} title="Clear"><Ico n="clear" /></button>}
              </div>
              <Keypad onKey={k => setTransferNumber(v => v + k)} />
              <div style={{ display: 'flex', gap: 16, width: '100%', justifyContent: 'center' }}>
                <button className="sp-btn secondary t-body-md" style={{ flex: 1 }} disabled={!numberOk}
                  onClick={() => startConsult(contactFromNumber(transferNumber.trim()))}>Consult First</button>
                <button className="sp-btn primary t-body-md" style={{ flex: 1 }} disabled={!numberOk} onClick={doTransfer}>Transfer Now</button>
              </div>
            </div>
          ) : <>
            <FilterRow filter={transferFilter} onFilter={setTransferFilter} search={transferSearch} onSearch={setTransferSearch} />
            <div className="sp-scroll" style={{ flex: 1, width: '100%' }}>
              {transferFilter === 'queues'
                ? <ListWithDividers items={queues} render={x => (
                    <QueueRow q={x} right={<button className="sp-btn secondary t-body-md" onClick={doTransfer}>Transfer</button>} />
                  )} />
                : <ListWithDividers items={users} render={u => (
                    <TransferUserRow u={u} onTransfer={() => setTransferTarget(u)} />
                  )} />}
            </div>
          </>}
        </div>
      </div>
    );
  };

  // ── Consulting ──
  const renderConsulting = () => {
    const target = consult.target;
    const held = consult.swapped ? target : caller;
    const talking = consult.swapped ? caller : target;
    const heldColor = held === caller ? (caller.unknown ? '#8D99AE' : '#B23C69') : '#8D99AE';
    const talkColor = talking === caller ? (caller.unknown ? '#8D99AE' : '#B23C69') : '#8D99AE';
    const talkMeta = talking.ext ? [`Ext. ${talking.ext}`, fmt(consultTimer)] : [fmt(consult.swapped ? callTimer : consultTimer)];
    return (
      <div className="sp-main" style={{ padding: 20, gap: 20, alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ flex: '1 0 0', width: '100%', display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
            <span className="t-accent-sm">On hold</span>
            <PartyRow p={held} color={heldColor} meta={['On hold', fmt(held === caller ? callTimer : consultTimer)]}
              right={<button className="sp-btn secondary t-body-md" onClick={() => setConsult(c => ({ ...c, swapped: !c.swapped }))}>Swap</button>} />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
            <span className="t-accent-sm">Talking to</span>
            <div style={{ background: 'rgba(255,255,255,0.05)', borderRadius: 4, padding: 8 }}>
              <PartyRow p={talking} color={talkColor} padding={0} meta={talkMeta} />
            </div>
          </div>
          <div className="sp-ctrls">
            <Ctrl icon={consultMuted ? 'mic-dark' : 'mic-off'} label={consultMuted ? 'Unmute' : 'Mute'} on={consultMuted} toggle onClick={() => setConsultMuted(m => !m)} />
            <Ctrl icon="dialpad" label="Keypad" onClick={() => showToast('Keypad sends tones to ' + talking.name)} />
            <Ctrl icon="merge" label="Merge" onClick={() => {
              const t = consult.target;
              setConsult(null);
              setParty(ps => [...ps, { ...t, color: '#8D99AE', status: 'connected', since: callTimer }]);
              setCallView('main');
            }} />
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, width: '100%', alignItems: 'center' }}>
          <button className="sp-btn primary full t-body-md" onClick={doTransfer}>Complete Transfer</button>
          <button className="sp-btn secondary full t-body-md" onClick={() => { setConsult(null); setCallView('main'); }}>Cancel &amp; Return to Caller</button>
        </div>
      </div>
    );
  };

  // ── Transferred ──
  const renderTransferred = () => (
    <div className="sp-main" style={{ padding: 32, gap: 32, alignItems: 'center' }}>
      <div className="t-body-md" style={{ width: 'calc(100% + 8px)', flexShrink: 0, padding: 16, borderRadius: 8, background: '#C9E5C3', color: '#363B4D', display: 'flex', alignItems: 'center' }}>
        Call transferred successfully!
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'center' }}>
        <Avatar p={caller} size={48} color={caller.unknown ? '#8D99AE' : '#B23C69'} />
        <span className="t-title-md">{caller.name}</span>
        <div className="t-body-md" style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', textAlign: 'center' }}>
          {!caller.unknown && caller.phone && <span>{caller.phone}</span>}
          {caller.company && <span>{caller.company}</span>}
        </div>
      </div>
      <span className="t-body-md">{fmtLong(transferredAfter)}</span>
      <button className="sp-btn secondary full t-body-md" onClick={() => { setScreen('idle'); setNavTab('keypad'); setOpen(false); restoreFocus(); }}>Done</button>
    </div>
  );

  // ─────────────────────────────────────────────────────────────
  // Panel body routing
  // ─────────────────────────────────────────────────────────────
  const renderBody = () => {
    if (screen === 'incoming') return renderIncoming();
    if (screen === 'outgoing') return renderOutgoing();
    if (screen === 'transferred') return renderTransferred();
    if (inCall) {
      if (consult) return renderConsulting();
      switch (callView) {
        case 'keypad':   return renderInCallKeypad();
        case 'details':  return renderContactDetails(caller, () => setCallView('main'));
        case 'transfer': return renderTransfer();
        case 'add':      return renderAdd();
        case 'people':   return renderPeople();
        default:         return renderCallMain();
      }
    }
    return <>
      {navTab === 'keypad' && renderKeypadTab()}
      {navTab === 'contacts' && renderContactsTab()}
      {navTab === 'extensions' && renderExtensionsTab()}
      {navTab === 'history' && renderHistoryTab()}
      {renderNav()}
    </>;
  };

  // ─────────────────────────────────────────────────────────────
  // Minimized bars
  // ─────────────────────────────────────────────────────────────
  const renderBar = () => {
    if ((screen === 'incoming' || screen === 'outgoing') && wideIncomingBar) {
      const outgoing = screen === 'outgoing';
      return (
        <div className="sp-bar" role="region" aria-label={outgoing ? 'Outgoing call' : 'Incoming call'} style={{ padding: '12px 16px', gap: 40, ...dragStyle(dockPos) }}>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <div className="sp-bar-handle" onMouseDown={dragStart} onDoubleClick={resetDock} aria-hidden="true" title="Drag to move · double-click to reset"><Ico n="drag" /></div>
            <div className="t-title-sm nowrap" style={{ display: 'flex', flexDirection: 'column', gap: 8, justifyContent: 'center' }}>
              <span>{caller.unknown ? caller.location : caller.name}</span>
              <span>{caller.phone}</span>
            </div>
          </div>
          <span className="t-body-sm nowrap">{outgoing ? 'Calling...' : 'Incoming call'}</span>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            {outgoing ? (
              <button className="sp-btn danger t-body-md" onClick={() => endCall('Call cancelled')}>End</button>
            ) : <>
              <button className="sp-btn decline t-body-md" title={`Decline (${MOD_KEY}+Shift+D)`} onClick={() => endCall('Call declined')}>Decline</button>
              <button data-primary-accept className="sp-btn accept-ticket t-body-md" title={`Accept & Add Ticket (${MOD_KEY}+Shift+A)`} onClick={() => acceptCall(true)}>Accept &amp; Add Ticket</button>
              <button className="sp-btn accept-outline t-body-md" title="Accept without ticket" onClick={() => { acceptCall(false); openPanel(); }}>Accept</button>
            </>}
            <button className="sp-icon-btn" style={{ width: 32, height: 32 }} title="Expand" aria-label="Expand softphone" onClick={openPanel}><Ico n="expand" /></button>
          </div>
        </div>
      );
    }
    let label, status, buttons;
    const name = caller.name;
    if (screen === 'incoming') {
      label = name; status = caller.unknown && caller.location ? `Incoming · ${caller.location}` : 'Incoming call';
      // Decline left, accept actions right; Accept & Add Ticket keeps its label (primary, one click)
      buttons = <>
        <button className="sp-btn decline icon-only" title={`Decline (${MOD_KEY}+Shift+D)`} aria-label="Decline" onClick={() => endCall('Call declined')}><Ico n="call-end" /></button>
        <button className="sp-btn accept-outline icon-only" title="Accept without ticket" aria-label="Accept without ticket" onClick={() => { acceptCall(false); openPanel(); }}><Ico n="row-call" /></button>
        <button data-primary-accept className="sp-btn accept-ticket t-body-md" title={`Accept & Add Ticket (${MOD_KEY}+Shift+A)`} onClick={() => acceptCall(true)}>Accept &amp; Add Ticket</button>
      </>;
    } else if (screen === 'outgoing') {
      label = name; status = 'Calling...';
      buttons = <button className="sp-btn danger t-body-md" onClick={() => endCall('Call cancelled')}>End</button>;
    } else if (isConference) {
      label = `${2 + connectedParty.length} people`; status = `Conference ${fmt(callTimer)}`;
      buttons = <button className="sp-btn danger t-body-md" onClick={() => endCall('Call ended for everyone')}>End</button>;
    } else if (onHold) {
      label = name; status = `On hold ${fmt(callTimer)}`;
      buttons = <button className="sp-btn success bordered t-body-md" onClick={() => setOnHold(false)}>Resume</button>;
    } else {
      label = name; status = fmt(callTimer);
      buttons = <button className="sp-btn danger t-body-md" onClick={() => endCall()}>End</button>;
    }
    return (
      <div className="sp-bar mini" role="region" aria-label="Softphone call controls" style={dragStyle(dockPos)}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', minWidth: 0 }}>
          <div className="sp-bar-handle" onMouseDown={dragStart} onDoubleClick={resetDock} aria-hidden="true" title="Drag to move · double-click to reset"><Ico n="drag" /></div>
          <div className={screen === 'incoming' ? 'sp-av ringing' : undefined} style={{ display: 'flex', borderRadius: 100 }}>
            <Avatar p={caller} size={24} color={caller.unknown ? '#8D99AE' : '#B23C69'} />
          </div>
          <div className="sp-bar-who">
            <span className="t-title-xs ellipsis" title={label}>{label}</span>
            <span className="t-body-sm nowrap">{status}</span>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {buttons}
          <button className="sp-icon-btn" style={{ width: 28, height: 28 }} title="Expand" aria-label="Expand softphone" onClick={openPanel}><Ico n="expand" /></button>
        </div>
      </div>
    );
  };

  // ─────────────────────────────────────────────────────────────
  // qManage app header
  // ─────────────────────────────────────────────────────────────
  const renderStateButton = () => {
    const focus = () => openPanel();
    const who = caller.unknown ? null : caller.name;
    if (screen === 'incoming' || screen === 'outgoing') {
      const label = screen === 'incoming' ? (who || 'Incoming call') : (who ? `Calling ${who}` : 'Calling');
      const full = screen === 'incoming' ? `Incoming call from ${caller.unknown ? `${caller.name}, ${caller.location}` : caller.name}` : `Calling ${caller.name}`;
      return (
        <button className="qm-call-chip t-body-md" onClick={focus} title={full} aria-label={`${full} — open softphone`}>
          <span className="ellipsis" style={{ maxWidth: 160 }}>{label}</span><Ico n="hdr-call-chip-phone" />
        </button>
      );
    }
    if (screen === 'active') {
      const t = `On a call with ${caller.name}`;
      return (
        <button className="qm-oncall" onClick={focus} title={t} aria-label={`${t} — open softphone`}>
          <Ico n="hdr-call-chip-phone" /><span className="qm-oncall-dot" />
        </button>
      );
    }
    return (
      <button className="qm-icon-btn" title="Phone" aria-label={open ? 'Close softphone' : 'Open softphone'} onClick={() => (open ? closePanel() : openPanel())}>
        <Ico n="hdr-phone" />
      </button>
    );
  };

  const measureAnchor = useCallback(() => {
    // Collapse search to an icon when logo + 250px search + right-side buttons don't fit (24px padding ×2, 16px gaps ×2)
    if (qmLeftRef.current && qmRightRef.current) {
      // Content widths (the two sides flex-grow, so measure their children, not the boxes)
      const contentW = (el, gap) => [...el.children].reduce((w, c) => w + c.offsetWidth, 0) + gap * Math.max(0, el.children.length - 1);
      const need = 48 + 32 + contentW(qmLeftRef.current, 16) + 250 + contentW(qmRightRef.current, 24);
      const compact = need > window.innerWidth;
      setSearchCompact(c => (c === compact ? c : compact));
      if (!compact) setSearchOpen(false);
    }
  }, []);
  React.useLayoutEffect(measureAnchor);
  useEffect(() => {
    window.addEventListener('resize', measureAnchor);
    return () => window.removeEventListener('resize', measureAnchor);
  }, [measureAnchor]);

  // ── Ringing: move focus to Accept & Add Ticket (panel or bar) ──
  useEffect(() => {
    if (screen !== 'incoming') return;
    const t = setTimeout(() => {
      const btn = document.querySelector('.sp-panel [data-primary-accept], .sp-bar [data-primary-accept]');
      if (btn) btn.focus();
    }, 30);
    return () => clearTimeout(t);
  }, [screen, open, minimized, wideIncomingBar]);

  // ── Keyboard shortcuts: ⌘/Ctrl+Shift+A accept & add ticket, ⌘/Ctrl+Shift+D decline, Esc minimize ──
  const keysRef = useRef({});
  keysRef.current = { screen, open, minimized, isCalling, ticketModalOpen, acceptCall, endCall, openPanel, minimize, closePanel };
  useEffect(() => {
    const onKey = (e) => {
      const k = keysRef.current;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.shiftKey && e.key.toLowerCase() === 'a' && k.screen === 'incoming') {
        e.preventDefault(); k.acceptCall(true);
      } else if (mod && e.shiftKey && e.key.toLowerCase() === 'd' && k.screen === 'incoming') {
        e.preventDefault(); k.endCall('Call declined');
      } else if (e.key === 'Escape' && k.open) {
        // With the ticket form open, Esc only minimizes when focus is in the call panel
        if (k.ticketModalOpen && !(e.target.closest && e.target.closest('.sp-panel'))) return;
        e.preventDefault();
        k.isCalling ? k.minimize() : k.closePanel();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const head = headerInfo();
  const panelHeight = screen === 'incoming' || screen === 'outgoing' ? 'auto' : 600;

  return (
    <>
      <div className="qm-header">
        <div className="qm-left" ref={qmLeftRef}>
          <Ico n="hdr-menu" />
          <button className="sp-icon-btn" title="Go to workspace" onClick={() => setOpenTicket(null)}><Ico n="hdr-logo" /></button>
        </div>
        {searchCompact ? (
          <button ref={searchRef} className="qm-icon-btn" title="Search qManage" aria-label="Search qManage" aria-expanded={searchOpen}
            onClick={() => setSearchOpen(true)} style={{ marginLeft: 'auto' }}>
            <Ico n="hdr-search" />
          </button>
        ) : (
          <div className="qm-search" ref={searchRef}>
            <span className="t-body-lg" style={{ flex: 1 }}>Search qManage</span>
            <Ico n="hdr-search" />
          </div>
        )}
        {searchCompact && searchOpen && (
          <div className="qm-search-open" role="search">
            <input autoFocus placeholder="Search qManage" aria-label="Search qManage"
              onKeyDown={e => { if (e.key === 'Escape') { e.stopPropagation(); setSearchOpen(false); } }}
              onBlur={() => setSearchOpen(false)} />
            <Ico n="hdr-search" />
          </div>
        )}
        <div className="qm-right" ref={qmRightRef}>
          <div className="qm-buttons">
            <div ref={stateBtnRef} style={{ display: 'flex' }}>{renderStateButton()}</div>
            <button className="qm-remote t-body-md"><Ico n="hdr-agent" /><span>Remote Support</span></button>
            <button className="qm-add-ticket t-body-md" onClick={() => { setTicketTitle(''); setTicketDesc(''); setTicketTitleError(false); setTicketContacts([]); setCallLink(null); setTicketModalOpen(true); }}><span>Add Ticket</span></button>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
              <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
                <Ico n="hdr-communication" />
                <Ico n="hdr-notifications" />
              </div>
              <button className="qm-star" title="Ticket summary"><Ico n="hdr-ai-star" /></button>
            </div>
          </div>
          <div className="qm-avatar"><Ico n="hdr-person" /></div>
        </div>
      </div>

      <div className="qm-content">
        {openTicket ? <TicketDetail ticket={openTicket} /> : <HomePage />}
      </div>

      <div className="demo-fab">
        {demoOpen && (
          <div className="demo-card">
            <h3>Prototype controls</h3>
            <div className="demo-row">
              <button className="demo-btn" onClick={() => triggerIncoming(CHARLIE)}>Incoming call — known contact</button>
              <button className="demo-btn" onClick={() => triggerIncoming(UNKNOWN_CALLER)}>Incoming call — unknown number</button>
            </div>
            <div className="demo-row">
              <span style={{ fontSize: 13, color: '#5F6475' }}>Minimized incoming bar:</span>
              <button className={`demo-btn ${!wideIncomingBar ? 'on' : ''}`} onClick={() => setWideIncomingBar(false)}>Compact</button>
              <button className={`demo-btn ${wideIncomingBar ? 'on' : ''}`} onClick={() => setWideIncomingBar(true)}>Simple (wide)</button>
            </div>
          </div>
        )}
        <button className={`demo-btn ${demoOpen ? 'on' : ''}`} onClick={() => setDemoOpen(o => !o)}>Prototype controls</button>
      </div>

      {minimized && isCalling && renderBar()}

      {open && !minimized && (
        <div ref={panelRef} className="sp-panel" role="dialog" aria-labelledby="sp-title" style={{ height: panelHeight, maxHeight: `calc(100vh - ${DOCK.top + SNAP_GAP}px)`, ...dragStyle(dockPos) }}>
          {renderHeader(head)}
          {head.banner && renderBanner()}
          {renderBody()}
        </div>
      )}

      <div className="sr-only" aria-live="assertive" aria-atomic="true">{announce}</div>
      {toast && (
        <div className="sp-toast t-body-md" role="status">
          <span>{toast.msg}</span>
          {toast.action && <button onClick={() => { toast.action.fn(); setToast(t => (t && t.id === toast.id ? null : t)); }}>{toast.action.label}</button>}
        </div>
      )}

      {ticketModalOpen && (
        <div className="nt-overlay" onClick={e => { if (e.target === e.currentTarget) setTicketModalOpen(false); }}>
          <div className="nt-modal" role="dialog" aria-labelledby="nt-title"
>
            <div className="nt-header">
              <span className="nt-title" id="nt-title">New Ticket</span>
              <button className="nt-hbtn" title="Help">?</button>
              <button className="nt-hbtn" onClick={() => setTicketModalOpen(false)} title="Close" aria-label="Close New Ticket">✕</button>
            </div>
            <div className="nt-body">
              <div>
                <div className="nt-section-label">Details</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div className="nt-field">
                    <label className="nt-label">Type <span>*</span></label>
                    <select className="nt-select" value={ticketType} onChange={e => setTicketType(e.target.value)}>
                      <option>Default</option>
                      <option>Bug</option>
                      <option>Feature Request</option>
                      <option>Support</option>
                    </select>
                  </div>
                  <div className="nt-field">
                    <label className="nt-label">Title <span>*</span></label>
                    <input className={`nt-input${ticketTitleError ? ' error' : ''}`} placeholder="" autoFocus
                      value={ticketTitle} onChange={e => { setTicketTitle(e.target.value); setTicketTitleError(false); }}/>
                    {ticketTitleError && <span className="nt-error">Please provide a title</span>}
                  </div>
                </div>
              </div>
              <div>
                <div className="nt-section-label">Contacts</div>
                {ticketContacts.length > 0 && (
                  <div className="nt-chips">
                    {ticketContacts.map(ch => (
                      <span key={ch.id} className={`nt-chip ${ch.unverified ? 'unverified' : ''}`} title={ch.unverified ? 'Unverified caller — identify them from the call panel' : `${ch.name}${ch.sub ? ' · ' + ch.sub : ''}`}>
                        {ch.unverified
                          ? <span className="nt-chip-av" style={{ background: '#A9AFBC' }}>?</span>
                          : <span className="nt-chip-av" style={{ background: ch.color }}>{ch.initials}</span>}
                        {ch.unverified ? <span style={{ fontWeight: 500 }}>{ch.label}</span> : <span>{ch.name}{ch.sub && <small> · {ch.sub}</small>}</span>}
                        <button className="nt-chip-x" aria-label={`Remove ${ch.name || ch.label}`} onClick={() => setTicketContacts(cs => cs.filter(x => x.id !== ch.id))}>×</button>
                      </span>
                    ))}
                  </div>
                )}
                <button className="nt-add-contacts">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                  Add Contacts
                </button>
              </div>
              <div>
                <div className="nt-section-label">Description</div>
                {callLink && callLink.logged && (
                  <div className="nt-calllog"><Ico n="hdr-call-chip-phone" /><span><b>Call with {callLink.callerName}</b> · {fmtShort(callLink.duration)} · Logged {timeNow()}</span></div>
                )}
                <div className="nt-desc-toolbar">
                  {['B','I','U','≡','≡','≡','⋮≡','⋮≡'].map((t,i) => <button key={i} className="nt-tool">{t}</button>)}
                </div>
                <textarea className="nt-desc-area" placeholder="" value={ticketDesc} onChange={e => setTicketDesc(e.target.value)}/>
              </div>
            </div>
            <div className="nt-footer">
              <div className="nt-priority-dot">1</div>
              <button className="nt-btn-save">Save and Create Another</button>
              <button className="nt-btn-create" onClick={() => {
                if (!ticketTitle.trim()) { setTicketTitleError(true); return; }
                setTicketModalOpen(false);
                ticketSeq.current += 1;
                setOpenTicket({ number: ticketSeq.current, title: ticketTitle.trim(), description: ticketDesc.trim(), type: ticketType,
                  created: `${dateAgo(0)} ${timeNow()}`, contacts: ticketContacts, callId: callLink && callLink.id, call: callLink });
                setTicketTitle(''); setTicketDesc(''); setTicketContacts([]);
                if (!isCalling || (callLink && callLink.logged)) setCallLink(null);
              }}>Create</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// Show focus rings after Tab / arrow-key navigation; hide them again on mouse use
window.addEventListener('keydown', e => { if (e.key === 'Tab' || e.key.startsWith('Arrow')) document.documentElement.classList.add('kbd-nav'); }, true);
window.addEventListener('mousedown', () => document.documentElement.classList.remove('kbd-nav'), true);

ReactDOM.createRoot(document.getElementById('app')).render(<SoftphoneApp />);
</script>
</body>
</html>
