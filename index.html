<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>qManage Softphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --sp-width: 350px; }  /* softphone panel width (Figma frames are 400) */
  body { font-family: 'Montserrat', sans-serif; background: #F4F6FB; min-height: 100vh; overflow: hidden; }
  button { font-family: 'Montserrat', sans-serif; }
  img { display: block; flex-shrink: 0; }

  /* ── Type scale (Figma text styles) ── */
  .t-title-xs  { font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.1px; }
  .t-title-sm  { font-weight: 600; font-size: 14px; line-height: 18px; letter-spacing: 0.1px; }
  .t-title-md  { font-weight: 600; font-size: 16px; line-height: 20px; letter-spacing: 0.15px; }
  .t-body-sm   { font-weight: 500; font-size: 12px; line-height: 14px; letter-spacing: 0.4px; }
  .t-body-md   { font-weight: 500; font-size: 14px; line-height: 18px; letter-spacing: 0.25px; }
  .t-body-lg   { font-weight: 500; font-size: 16px; line-height: 20px; letter-spacing: 0.5px; }
  .t-accent-sm { font-weight: 400; font-size: 12px; line-height: 14px; letter-spacing: 0; }
  .t-accent-md { font-weight: 400; font-size: 14px; line-height: 18px; letter-spacing: 0.25px; }
  .t-semi-md   { font-weight: 600; font-size: 14px; line-height: 18px; letter-spacing: 0; }
  .nowrap { white-space: nowrap; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* ── qManage app header ── */
  .qm-header {
    position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 10;
    display: flex; align-items: center; gap: 16px; padding: 8px 24px 12px 24px;
    background: #FFFFFF; border-bottom: 1px solid #CED0D4; overflow: hidden;
  }
  .qm-left { flex: 1 0 auto; display: flex; gap: 16px; align-items: center; }
  .qm-search {
    flex: 0 1 500px; min-width: 250px; height: 40px; padding: 8px 12px;
    display: flex; gap: 8px; align-items: center; background: #F2F3F7; border-radius: 8px; color: #8D99AE;
  }
  /* Not enough room: search collapses to an icon; opening it overlays a full-width field on the header */
  .qm-search-open { position: absolute; inset: 12px 24px; z-index: 2; display: flex; gap: 8px; align-items: center; height: 40px; padding: 8px 12px; background: #F2F3F7; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .qm-search-open input { flex: 1; min-width: 0; border: none; outline: none; background: none; font: 500 16px/20px 'Montserrat', sans-serif; letter-spacing: 0.5px; color: #363B4D; }
  .qm-search-open input::placeholder { color: #8D99AE; }
  .qm-right { flex: 1 0 auto; display: flex; justify-content: flex-end; align-items: center; gap: 24px; }
  .qm-buttons { display: flex; gap: 16px; align-items: center; }
  .qm-buttons > * { flex-shrink: 0; white-space: nowrap; }
  .qm-icon-btn { width: 36px; height: 36px; padding: 0 4px; border-radius: 4px; background: #F2F3F7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qm-call-chip {
    display: flex; align-items: center; height: 36px; padding: 8px; border: none; border-radius: 4px;
    background: #94CC86; color: #253322; cursor: pointer; overflow: hidden;
  }
  .qm-call-chip span { padding: 0 8px; }
  .qm-remote { display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 4px; background: #F2F3F7; border: none; color: #5F6475; cursor: pointer; }
  .qm-remote span { padding: 0 8px; }
  .qm-add-ticket { display: flex; align-items: center; height: 36px; padding: 8px; border-radius: 4px; background: #007FAD; border: 1px solid #007FAD; color: #fff; cursor: pointer; }
  .qm-add-ticket span { padding: 0 8px; }
  .qm-star { width: 30px; height: 30px; border-radius: 16px; background: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .qm-avatar { width: 32px; height: 32px; border-radius: 100px; background: #A4495D; display: flex; align-items: center; justify-content: center; }
  /* ── Workspace / home page (Figma "My Workspace" 2458:43293) ── */
  .qm-content {
    position: fixed; top: 64px; left: 0; right: 0; bottom: 0; overflow: auto;
    background: url(assets/icons/home-background.png) top center / cover no-repeat, #FDFDFD;
  }
  .hm-page { height: 100%; min-height: 720px; padding: 40px 100px; display: flex; flex-direction: column; gap: 48px; color: #363B4D; }
  .hm-head { display: flex; justify-content: space-between; align-items: flex-end; }
  .hm-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto minmax(420px, 1fr); gap: 24px; }
  .hm-btn-icon { width: 36px; height: 36px; padding: 0 4px; border-radius: 4px; border: none; background: #F2F3F7; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .hm-btn-icon:hover { background: #e6e8ee; }
  .hm-card {
    background: #FFFFFF; border: 1px solid #CED0D4; border-radius: 8px; box-shadow: 0 2px 7px 0 rgba(0,125,171,0.10);
  }
  .hm-stat { padding: 16px 24px; display: flex; align-items: center; gap: 24px; overflow: hidden; cursor: pointer; text-align: left; font-family: inherit; }
  .hm-stat:hover { border-color: #8D99AE; }
  .hm-tile { width: 48px; height: 48px; padding: 4px; border-radius: 4px; flex-shrink: 0; }
  .hm-stat-label { font-weight: 500; font-size: 16px; line-height: 20px; letter-spacing: 0.5px; color: #5F6475; white-space: nowrap; }
  .hm-stat-num { font-weight: 500; font-size: 32px; line-height: 40px; color: #363B4D; }
  .hm-track { flex: 1; height: 12px; background: #F4F6FB; border-radius: 8px; overflow: hidden; position: relative; }
  .hm-panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-height: 0; }
  .hm-panel-title { font-weight: 600; font-size: 18px; line-height: 24px; color: #363B4D; white-space: nowrap; }
  .hm-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
  .hm-check { display: flex; gap: 8px; align-items: center; border: none; background: none; cursor: pointer; padding: 0; color: #5F6475; }
  .hm-check-off { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .hm-check-off::before { content: ''; width: 18px; height: 18px; border: 2px solid #5F6475; border-radius: 2px; }
  .hm-ticket { flex-shrink: 0; background: #FFFFFF; border: 1px solid #CED0D4; border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .hm-ticket:hover { background: #F2F3F7; }
  .hm-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; }
  .hm-av { width: 20px; height: 20px; border-radius: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 8px; line-height: normal; letter-spacing: 0.1px; }
  .hm-av24 { width: 24px; height: 24px; border-radius: 100px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; line-height: normal; letter-spacing: 0.1px; }
  .hm-activity { flex-shrink: 0; background: #FFFFFF; border: 1px solid #CED0D4; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .hm-activity:hover { background: #F7F8FB; }
  .hm-act-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: #363B4D; }

  /* ── Ticket detail view (Figma "Ticket Detail View" 1890:24506) ── */
  .td-page { min-height: 100%; background: #F2F8FB; color: #363B4D; display: flex; flex-direction: column; gap: 16px; }
  .td-titlebar { background: #fff; border-bottom: 1px solid #CED0D4; box-shadow: 0 2px 7px rgba(0,125,171,0.10); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .td-h { font-weight: 500; font-size: 24px; line-height: 26px; white-space: nowrap; }
  .td-accent { font-weight: 400; font-size: 14px; line-height: 18px; color: #5F6475; white-space: nowrap; }
  .td-label { font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: #5F6475; }
  .td-card-title { font-weight: 600; font-size: 18px; line-height: 24px; color: #363B4D; white-space: nowrap; }
  .td-empty { font-weight: 500; font-size: 14px; line-height: 18px; letter-spacing: 0.25px; color: #8D99AE; text-align: center; }
  .td-select { height: 28px; background: #fff; border: 1px solid #CED0D4; border-radius: 4px; display: flex; align-items: center; cursor: pointer; }
  .td-btn2 { height: 36px; padding: 0 8px; border-radius: 4px; border: none; background: #F2F3F7; color: #5F6475; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
  .td-btn2:hover, .td-icon-btn:hover { background: #e6e8ee; }
  .td-icon-btn { width: 36px; height: 36px; padding: 0 4px; border-radius: 4px; border: none; background: #F2F3F7; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .td-primary { height: 36px; padding: 8px; border-radius: 4px; border: 1px solid #007FAD; background: #007FAD; color: #fff; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
  .td-primary:hover { background: #006d95; }
  .td-body { padding: 0 16px 16px; display: flex; gap: 16px; align-items: flex-start; }
  .td-left { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .td-right { flex: 0 0 632px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .td-card { background: #fff; border: 1px solid #CED0D4; border-radius: 8px; box-shadow: 0 2px 7px 0 rgba(0,125,171,0.10); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .td-card-head { display: flex; justify-content: space-between; align-items: center; height: 24px; }
  .td-plain { border: none; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #007FAD; }
  .td-chev { transition: transform 0.15s; }
  .td-chev.collapsed { transform: rotate(-90deg); }
  .td-field { flex: 1 1 0; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
  .td-control { position: relative; height: 36px; background: #fff; border: 1px solid #CED0D4; border-radius: 4px; padding: 8px; display: flex; align-items: center; gap: 8px; }
  .td-control input, .td-control select {
    flex: 1; min-width: 0; height: 18px; border: none; outline: none; background: none; appearance: none; -webkit-appearance: none;
    font: 500 14px/18px 'Montserrat', sans-serif; letter-spacing: 0.25px; color: #363B4D; cursor: pointer;
  }
  .td-control input::placeholder { color: #CED0D4; font-style: italic; }
  .td-control:focus-within { border-color: #007FAD; }
  .td-control img { pointer-events: none; }
  .td-jump { width: 32px; height: 32px; border: none; background: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .td-jump:hover { background: #F2F3F7; }

  /* ── Prototype controls (not part of the design) ── */
  .demo-fab { position: fixed; left: 16px; bottom: 16px; z-index: 900; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .demo-card { display: inline-flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px dashed #CED0D4; border-radius: 8px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .demo-card h3 { font-size: 12px; font-weight: 600; color: #8D99AE; text-transform: uppercase; letter-spacing: 0.6px; }
  .demo-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .demo-btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid #CED0D4; background: #fff; color: #363B4D; font-size: 13px; font-weight: 500; cursor: pointer; }
  .demo-btn:hover { background: #F4F6FB; }
  .demo-btn.on { background: #363B4D; color: #fff; border-color: #363B4D; }

  /* ── Softphone panel ── */
  /* Softphone sits above the New Ticket overlay (z 2000) so the call stays usable while ticketing */
  .sp-panel {
    position: fixed; z-index: 2100; width: var(--sp-width); background: #363B4D; border-radius: 8px;
    box-shadow: 0 0 2px 0 rgba(0,0,0,0.16), 0 1px 4px 0 rgba(0,0,0,0.16), 0 12px 32px rgba(0,0,0,0.18);
    display: flex; flex-direction: column; overflow: hidden; color: #fff; user-select: none;
  }
  .sp-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 4px;
    background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), #363B4D;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sp-head-left { display: flex; gap: 8px; align-items: center; }
  .sp-head-right { display: flex; align-items: center; }
  .sp-hbtn { width: 40px; height: 40px; padding: 8px; border-radius: 200px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sp-hbtn:hover { background: rgba(255,255,255,0.08); }
  .sp-hbtn.drag { cursor: grab; }
  .sp-hbtn.drag:active { cursor: grabbing; }
  .sp-chip { display: flex; align-items: center; gap: 8px; height: 24px; padding: 4px 8px; border-radius: 200px; background: #CED0D4; color: #363B4D; font-variant-numeric: tabular-nums; }

  .sp-banner {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px;
    background: rgba(148,204,134,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); overflow: hidden; cursor: pointer;
  }
  .sp-banner:hover { background: rgba(148,204,134,0.26); }
  .sp-banner-left { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .sp-vdiv { width: 1px; height: 23px; background: #CED0D4; flex-shrink: 0; }

  .sp-main { flex: 1 0 0; min-height: 0; width: 100%; display: flex; flex-direction: column; }
  .sp-scroll { overflow-y: auto; min-height: 0; }
  .sp-scroll::-webkit-scrollbar { width: 4px; }
  .sp-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  /* Bottom nav */
  .sp-nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px; background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), #363B4D; }
  .sp-nav-item { width: 75px; padding: 4px; border-radius: 4px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; color: #8D99AE; }
  .sp-nav-item.on { color: #FFFFFF; }
  .sp-nav-item:hover { background: rgba(255,255,255,0.05); }

  /* Avatar */
  .sp-av { border-radius: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; color: #fff; font-weight: 600; text-align: center; }

  /* Inputs */
  .sp-field { height: 40px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #5F6475; border-radius: 8px; overflow: hidden; }
  .sp-field input { flex: 1; min-width: 0; height: 18px; border: none; outline: none; background: none; color: #fff; font: 500 14px/18px 'Montserrat', sans-serif; letter-spacing: 0.25px; }
  .sp-field input::placeholder { color: #CED0D4; font-style: italic; }
  .sp-search { height: 40px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #5F6475; border-radius: 8px; overflow: hidden; }
  .sp-search.filled { border-color: #8D99AE; }
  .sp-search input { flex: 1; min-width: 0; border: none; outline: none; background: none; color: #fff; font: 500 16px/20px 'Montserrat', sans-serif; letter-spacing: 0.5px; }
  .sp-search input::placeholder { color: #8D99AE; }
  .sp-icon-btn { border: none; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* Keypad */
  .sp-keypad { display: inline-grid; grid-template-columns: repeat(3, 48px); column-gap: 24px; row-gap: 16px; }
  .sp-key { width: 48px; height: 48px; padding: 8px; border-radius: 200px; border: none; background: #5F6475; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sp-key:hover { background: #6c7184; }
  .sp-key:active { background: #7a8093; }
  .sp-key.call { background: #94CC86; }
  .sp-key.call:hover { background: #86bd78; }
  .sp-key.call:disabled { background: #4A6643; cursor: default; }

  /* Segmented control */
  .sp-seg { width: 100%; display: flex; align-items: center; padding: 2px; background: #5F6475; border-radius: 4px; flex-shrink: 0; }
  .sp-seg button { flex: 1 0 0; padding: 8px; border-radius: 4px; border: none; background: none; color: #fff; cursor: pointer; white-space: nowrap; }
  .sp-seg button.on { background: #F4F6FB; color: #363B4D; }

  /* Buttons */
  .sp-btn { height: 36px; padding: 0 16px; border-radius: 4px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; }
  .sp-btn.primary { background: #007FAD; border: 1px solid #007FAD; color: #fff; }
  .sp-btn.primary:hover { background: #006d95; }
  .sp-btn.secondary { background: #F2F3F7; color: #5F6475; }
  .sp-btn.secondary:hover { background: #e3e5ec; }
  .sp-btn.danger { background: #ED4B52; color: #fff; }   /* Figma status/error */
  .sp-btn.danger:hover { background: #d9434a; }
  /* Incoming-call actions — same weights everywhere; Decline always left, accept actions right */
  .sp-btn.accept-ticket { background: #94CC86; color: #363B4D; }
  .sp-btn.accept-ticket:hover { background: #86bd78; }
  .sp-btn.accept-plain { background: transparent; border: 1px solid #8D99AE; color: #fff; }
  .sp-btn.accept-plain:hover { background: rgba(255,255,255,0.08); }
  .sp-btn.decline { background: #ED4B52; color: #fff; }
  .sp-btn.decline:hover { background: #d9434a; }
  .sp-btn.icon-only { width: 36px; padding: 0; }
  .sp-btn.success { background: #94CC86; color: #363B4D; }
  .sp-btn.success.bordered { border: 1px solid #94CC86; }
  .sp-btn.success:hover { background: #86bd78; }
  .sp-btn.accept-outline { background: #fff; border: 1px solid #4A6643; color: #4A6643; }
  .sp-btn.accept-outline:hover { background: #eef5ec; }
  .sp-btn.full { width: 100%; }
  .sp-btn:disabled { opacity: 0.5; cursor: default; }
  .sp-link { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0; border: none; background: none; color: #87CFE7; cursor: pointer; white-space: nowrap; }
  .sp-link:hover { text-decoration: underline; }
  .sp-row-call { width: 36px; height: 36px; padding: 0 4px; border-radius: 4px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sp-row-call:hover { background: rgba(148,204,134,0.15); }

  /* Lists */
  .sp-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .sp-div { width: 100%; height: 1px; background: #5F6475; flex-shrink: 0; }
  .sp-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sp-row-left { display: flex; gap: 4px; align-items: center; min-width: 0; }
  .sp-col4 { display: flex; flex-direction: column; gap: 4px; justify-content: center; align-items: flex-start; min-width: 0; }
  .sp-line { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .sp-status { display: flex; gap: 4px; align-items: center; }

  /* Call controls */
  .sp-ctrls { width: 174px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; align-content: flex-start; row-gap: 29px; column-gap: 27px; }
  .sp-ctrl { width: 40px; display: flex; flex-direction: column; gap: 4px; align-items: center; border: none; background: none; padding: 0; cursor: pointer; color: #AEB7C6; }  /* 5.5:1 */
  .sp-ctrl-circle { width: 36px; height: 36px; padding: 8px; border-radius: 200px; background: #5F6475; display: flex; align-items: center; justify-content: center; }
  .sp-ctrl:hover .sp-ctrl-circle { background: #6c7184; }
  .sp-ctrl.on { color: #fff; }
  .sp-ctrl.on .sp-ctrl-circle { background: #fff; }
  .sp-ctrl.disabled { opacity: 0.25; pointer-events: none; }
  .sp-ctrl-label { font-weight: 400; font-size: 12px; line-height: 14px; text-align: center; white-space: nowrap; }

// ─────────────────────────────────────────────────────────────
// Drag hook — while dragging, position is {r: right, b: bottom}. On release it snaps to the
// nearest corner ('tl' | 'bl' | 'br'); null means the default home (top-right, DOCK).
// Double-clicking the handle resets to null.
// ─────────────────────────────────────────────────────────────
const SNAP_GAP = 16;
const CORNER_STYLE = {
  tl: { top: DOCK.top, left: SNAP_GAP },
  bl: { bottom: SNAP_GAP, left: SNAP_GAP },
  br: { bottom: SNAP_GAP, right: SNAP_GAP },
};
const dragStyle = (pos) => (pos == null ? DOCK : typeof pos === 'string' ? CORNER_STYLE[pos] : { right: pos.r, bottom: pos.b });

function useDrag() {
  const [pos, setPos] = useState(null);
  const start = useCallback((e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const el = e.currentTarget.closest('.sp-panel, .sp-bar');
    const rect = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const r = window.innerWidth - rect.right;
    const b = window.innerHeight - rect.bottom;
    let moved = false;
    // Keep the whole element on screen while dragging
    const move = (ev) => {
      if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 4) return;   // ignore clicks / double-clicks
      moved = true;
      setPos({
        r: Math.max(0, Math.min(window.innerWidth - rect.width, r - (ev.clientX - sx))),
        b: Math.max(0, Math.min(window.innerHeight - rect.height, b - (ev.clientY - sy))),
      });
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      if (!moved) return;
      // Snap to whichever corner the element's centre is closest to
      const f = el.getBoundingClientRect();
      const left = f.left + f.width / 2 < window.innerWidth / 2;
      const top = f.top + f.height / 2 < window.innerHeight / 2;
      setPos(top ? (left ? 'tl' : null) : (left ? 'bl' : 'br'));
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }, []);
  const reset = useCallback(() => setPos(null), []);
  return [pos, start, reset];
}

            <button className="td-primary"><span className="t-body-md" style={{ padding: '0 8px' }}>Actions</span><TdIco n="td-caret-down-white" s={20} /></button>
          </div>
        </div>
      </div>

      <div className="td-body">
        <div className="td-left">
          <div className="td-card">
            <div className="td-card-head">
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <TdIco n="td-description" /><span className="td-card-title">Description</span>
                <button className="td-plain" title="Edit description"><TdIco n="td-edit-pencil" /></button>
              </div>
              <button className="td-plain t-body-md" style={{ height: 24 }}><TdIco n="td-section-plus" />Create Checklist</button>
            </div>
            <p className="t-body-md" style={{ color: '#5F6475', whiteSpace: 'pre-wrap' }}>{ticket.description || TD_DEFAULT_DESC}</p>
          </div>

          <div className="td-card" style={{ height: 601, overflow: 'hidden' }}>
            <div className="td-card-head">
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}><TdIco n="td-activity" /><span className="td-card-title">Activity</span></div>
              <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
                <button className="td-primary" style={{ border: 'none' }}><TdIco n="td-add-white" s={20} /><span className="t-body-md" style={{ padding: '0 8px' }}>Add Note</span></button>
                <button className="td-plain" title="Expand"><TdIco n="td-open-in-full" /></button>
              </div>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div className="td-field" style={{ flex: '0 0 226px' }}>
                <span className="td-label">Find</span>
                <label className="td-control"><input placeholder="Search Activity" style={{ cursor: 'text' }} /><TdIco n="td-search" s={20} /></label>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="td-plain" title="Sort"><TdIco n="td-arrow-downward" /></button>
                <button className="td-plain" title="Filter"><TdIco n="td-filter" /></button>
              </div>
            </div>
            {ticket.call && ticket.call.logged ? (
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div style={{ display: 'flex', gap: 12, alignItems: 'center', padding: 12, border: '1px solid #CED0D4', borderLeft: '3px solid #94CC86', borderRadius: 8 }}>
                  <img src="assets/icons/hdr-call-chip-phone.svg" width="20" height="20" alt="" />
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                    <span className="t-semi-md">Call with {ticket.call.callerName} · {fmtShort(ticket.call.duration)}</span>
                    <span className="t-body-sm" style={{ color: '#8D99AE' }}>Logged {ticket.created} by John Doe</span>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '64px 0' }}>
                <span className="td-empty nowrap">{ticket.call ? 'Call in progress — it will be logged here when it ends.' : 'No activity yet. Add a note to get started.'}</span>
              </div>
            )}
          </div>
        </div>

        <div className="td-right">
          <div className="td-card" style={{ padding: '8px 16px', flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
              <span className="td-accent">Jump to</span>
              <div style={{ display: 'flex', gap: 8 }}>
                {TD_SECTIONS.map(sec => (
                  <button key={sec.id} className="td-jump" title={sec.title} onClick={() => jump(sec.id)}><TdIco n={sec.jump} /></button>
                ))}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', alignSelf: 'stretch' }}>
              <div style={{ width: 1, alignSelf: 'stretch', background: '#CED0D4' }} />
              <button className="td-plain" title="Customize sections"><TdIco n="home-settings" /></button>
            </div>
          </div>

          {TD_SECTIONS.map(sec => (
            <div key={sec.id} ref={el => (refs.current[sec.id] = el)} className="td-card" style={{ scrollMarginTop: 16 }}>
              <div className="td-card-head">
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}><TdIco n={`td-${sec.icon}`} /><span className="td-card-title">{sec.title}</span></div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  {sec.viewAll && <button className="td-plain t-body-md" style={{ height: 24 }}>View All</button>}
                  {sec.add && <button className="td-plain" title={`Add to ${sec.title}`}><TdIco n="td-section-plus" /></button>}
                  <button className="td-plain" title={collapsed[sec.id] ? 'Expand' : 'Collapse'} onClick={() => setCollapsed(c => ({ ...c, [sec.id]: !c[sec.id] }))}>
                    <span className={`td-chev ${collapsed[sec.id] ? 'collapsed' : ''}`} style={{ display: 'flex' }}><TdIco n="td-chevron-down" /></span>
                  </button>
                </div>
              </div>
              {!collapsed[sec.id] && renderBody(sec)}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Contacts-field chip for the New Ticket form, built from the caller
const contactChip = (c) => c.unknown
  ? { id: c.id, unverified: true, label: [c.name, c.location, 'Unknown'].filter(Boolean).join(' · ') }
  : { id: c.id, name: c.name, sub: c.company, initials: c.initials || initialsOf(c.name), color: '#B23C69' };

// ─────────────────────────────────────────────────────────────
// Main App
// ─────────────────────────────────────────────────────────────
function SoftphoneApp() {
  // Panel / chrome
  const [open, setOpen] = useState(false);
  const [minimized, setMinimized] = useState(false);
  const [toast, setToast] = useState(null);
  const [wideIncomingBar, setWideIncomingBar] = useState(false);
  const [demoOpen, setDemoOpen] = useState(false);

  // Idle browsing
  const [navTab, setNavTab] = useState('keypad');          // keypad | contacts | extensions | history
  const [dialInput, setDialInput] = useState('');
  const [contactSearch, setContactSearch] = useState('');
  const [extSearch, setExtSearch] = useState('');
  const [extView, setExtView] = useState('all');             // all | favorites | users | queues | groups
  const [extMenu, setExtMenu] = useState(false);
  const [favorites, setFavorites] = useState(['e1']);
  const [viewUser, setViewUser] = useState(null);           // idle extension details
  const [historyTab, setHistoryTab] = useState('all');
  const [viewContact, setViewContact] = useState(null);     // idle contact details

  // Call
  const [screen, setScreen] = useState('idle');             // idle | incoming | outgoing | active | transferred
  const [caller, setCaller] = useState(CHARLIE);
  const [incomingExpanded, setIncomingExpanded] = useState(false);
  const [callView, setCallView] = useState('main');        // main | keypad | details | transfer | add | people
  const [callTimer, setCallTimer] = useState(0);
  const [muted, setMuted] = useState(false);
  const [onHold, setOnHold] = useState(false);
  const [dtmf, setDtmf] = useState('');
  const [party, setParty] = useState([]);                  // added participants: {...p, status: ringing|connected, since}

  // Transfer
  const [transferTab, setTransferTab] = useState('extensions'); // extensions | keypad
  const [transferFilter, setTransferFilter] = useState('users'); // users | queues
  const [transferSearch, setTransferSearch] = useState('');
  const [transferNumber, setTransferNumber] = useState('');
  const [transferTarget, setTransferTarget] = useState(null);
  const [consult, setConsult] = useState(null);            // { target, swapped }
  const [consultTimer, setConsultTimer] = useState(0);
  const [consultMuted, setConsultMuted] = useState(false);
  const [transferredAfter, setTransferredAfter] = useState(0);

  // Add someone
  const [addTab, setAddTab] = useState('extensions');      // extensions | keypad
  const [addFilter, setAddFilter] = useState('users');     // users | queues
  const [addSearch, setAddSearch] = useState('');
  const [addNumber, setAddNumber] = useState('');

  // Ticket modal
  const [ticketModalOpen, setTicketModalOpen] = useState(false);
  const [ticketTitle, setTicketTitle] = useState('');
  const [ticketDesc, setTicketDesc] = useState('');
  const [openTicket, setOpenTicket] = useState(null);    // ticket shown in place of the workspace after Create
  const ticketSeq = useRef(0);
  const [ticketType, setTicketType] = useState('Default');
  const [ticketTitleError, setTicketTitleError] = useState(false);
  const [ticketContacts, setTicketContacts] = useState([]);  // chips in the form's Contacts field
  const [callLink, setCallLink] = useState(null);            // call attached to the ticket form: { id, callerName, logged, duration }
  const [whoMode, setWhoMode] = useState(null);              // unknown caller: null | 'new' | 'link'
  const [newContactName, setNewContactName] = useState('');
  const [announce, setAnnounce] = useState('');              // aria-live text
  const returnFocusRef = useRef(null);

  // Panel opens docked under the header phone button until the user drags it (r/b stay null until then)
  // Panel and both bars share one position, so minimizing/expanding happens in the same corner
  const [dockPos, dragStart, resetDock] = useDrag();
  const panelRef = useRef(null);
  const stateBtnRef = useRef(null);
  const searchRef = useRef(null);
  const qmLeftRef = useRef(null), qmRightRef = useRef(null);
  const [searchCompact, setSearchCompact] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  // Docked positions measured from the header: under the phone button (panel, compact bar) and over the search bar (simple bar)

  const inCall = screen === 'active';
  const isCalling = screen === 'incoming' || screen === 'outgoing' || screen === 'active';
  const ringingParty = party.filter(p => p.status === 'ringing');
  const connectedParty = party.filter(p => p.status === 'connected');
  const isConference = inCall && connectedParty.length > 0 && !consult;

  // Toasts can carry one action (e.g. "Log to ticket"); those stay up longer
  const showToast = useCallback((msg, action) => {
    const t = { msg, action, id: Date.now() + Math.random() };
    setToast(t);
    setTimeout(() => setToast(cur => (cur && cur.id === t.id ? null : cur)), action ? 6000 : 2400);
  }, []);

  // Timers
  useEffect(() => {
    if (!inCall) return;
    const t = setInterval(() => setCallTimer(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [inCall]);
  useEffect(() => {
    if (!consult) return;
    const t = setInterval(() => setConsultTimer(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [consult]);

  // Ringing participants pick up after a few seconds
  useEffect(() => {
    if (ringingParty.length === 0) return;
    const t = setTimeout(() => {
      setParty(ps => ps.map(p => p.status === 'ringing' ? { ...p, status: 'connected', since: callTimerRef.current } : p));
    }, 4000);
    return () => clearTimeout(t);
  }, [ringingParty.length]);
  const callTimerRef = useRef(0);
  callTimerRef.current = callTimer;
  const ticketModalOpenRef = useRef(false);
  ticketModalOpenRef.current = ticketModalOpen;

  // Auto-trigger an incoming call shortly after load (demo)
  useEffect(() => {
    const t = setTimeout(() => triggerIncoming(CHARLIE), 1500);
    return () => clearTimeout(t);
  }, []);

  // ── Call handlers ──
  const resetCallState = () => {
    setCallView('main'); setMuted(false); setOnHold(false); setDtmf(''); setParty([]);
    setTransferTab('extensions'); setTransferFilter('users');
    setTransferSearch(''); setTransferNumber(''); setTransferTarget(null);
    setConsult(null); setConsultTimer(0); setConsultMuted(false);
    setAddTab('extensions'); setAddFilter('users'); setAddSearch(''); setAddNumber('');
  };

  const triggerIncoming = (c) => {
    resetCallState();
    // Remember where focus was so it can go back when the panel closes
    const active = document.activeElement;
    if (active && active !== document.body && !active.closest('.sp-panel, .sp-bar')) returnFocusRef.current = active;
    setCaller(c);
    setIncomingExpanded(false);
    setWhoMode(null); setNewContactName('');
    setScreen('incoming');
    setOpen(true); setMinimized(false);
    setAnnounce('');
    setTimeout(() => setAnnounce(`Incoming call from ${c.unknown ? `${c.name}, ${c.location}` : c.name}`), 50);
  };

  const restoreFocus = () => {
    const el = returnFocusRef.current;
    returnFocusRef.current = null;
    setTimeout(() => { if (el && document.contains(el)) el.focus(); }, 0);
  };

  const startCall = (c) => {
    resetCallState();
    setCaller(c);
    setCallTimer(0);
    setScreen('outgoing');
    setOpen(true); setMinimized(false);
    setTimeout(() => setScreen(s => (s === 'outgoing' ? 'active' : s)), 2500);
  };

  const acceptCall = (withTicket) => {
    setCallTimer(0);
    setScreen('active');
    setCallView('main');
    if (withTicket) openLinkedTicket(caller);
  };

  // New Ticket form pre-filled from the caller, with the live call attached
  const openLinkedTicket = (c) => {
    setTicketTitle(''); setTicketDesc(''); setTicketTitleError(false);
    setTicketContacts([contactChip(c)]);
    setCallLink({ id: Date.now(), callerName: c.name, logged: false, duration: 0 });
    // Collapse the call to the minimized bar so the centred form is unobstructed
    setMinimized(true); setOpen(false);
    setTicketModalOpen(true);
  };

  // Ends (or declines/cancels) the call: logs it to an attached ticket, collapses the panel to the header icon
  const endCall = (msg) => {
    const wasActive = screen === 'active';
    const dur = callTimerRef.current;
    if (wasActive && callLink && !callLink.logged) {
      const logged = { ...callLink, callerName: caller.name, logged: true, duration: dur };
      setCallLink(logged);
      setOpenTicket(t => (t && t.callId === logged.id ? { ...t, call: logged } : t));
    }
    resetCallState();
    setScreen('idle');
    setDialInput('');
    setNavTab('keypad');
    setMinimized(false);
    setOpen(false);
    setWhoMode(null);
    setAnnounce('');
    const text = msg || (wasActive ? `Call ended · ${fmtShort(dur)}` : 'Call ended');
    if (wasActive && ticketModalOpenRef.current) {
      const alreadyLinked = callLink && callLink.callerName;
      showToast(text, { label: 'Log to ticket', fn: () => {
        if (alreadyLinked) { showToast('Call already logged to this ticket'); return; }
        setCallLink({ id: Date.now(), callerName: caller.name, logged: true, duration: dur });
      } });
    } else {
      showToast(text);
    }
    restoreFocus();
  };

  // Unknown caller identified mid-call: the caller and the ticket's placeholder chip become the real contact
  const identifyCaller = (contact, how) => {
    const known = { ...contact, kind: 'contact', unknown: false, initials: contact.initials || initialsOf(contact.name),
      phone: caller.phone, location: caller.location, color: undefined };
    setCaller(known);
    setTicketContacts(cs => cs.map(ch => (ch.unverified ? contactChip(known) : ch)));
    setCallLink(l => (l ? { ...l, callerName: known.name } : l));
    setWhoMode(null); setNewContactName('');
    showToast(how === 'new' ? `Contact created: ${known.name}` : `Linked to ${known.name}`);
  };

  const doTransfer = () => {
    setTransferredAfter(callTimer);
    resetCallState();
    setScreen('transferred');
    setMinimized(false); setOpen(true);
  };

  const startConsult = (target) => {
    setConsult({ target, swapped: false });
    setConsultTimer(0); setConsultMuted(false);
    setCallView('main');
  };

  const addParticipant = (p) => {
    setParty(ps => [...ps, { ...p, color: p.color || '#8D99AE', status: 'ringing', since: callTimer }]);
    setAddSearch(''); setAddNumber('');
    setCallView('main');
  };

  const openTransfer = () => {
    setTransferTab('extensions'); setTransferFilter('users'); setTransferTarget(null);
    setTransferSearch(''); setTransferNumber('');
    setCallView('transfer');
  };

  const openPanel = () => { setMinimized(false); setOpen(true); };
  const minimize = () => { if (isCalling) { setMinimized(true); setOpen(false); } else setOpen(false); };
  const closePanel = () => {
    if (isCalling) { minimize(); return; }
    setOpen(false);
    if (screen === 'transferred') setScreen('idle');
    restoreFocus();
  };

  // ─────────────────────────────────────────────────────────────
  // Header + banner
  // ─────────────────────────────────────────────────────────────
  const headerInfo = () => {
    if (screen === 'incoming') return { title: 'Incoming call' };
    if (screen === 'outgoing') return { title: 'Calling...' };
    if (screen === 'transferred') return { title: 'Call transferred' };
    if (!inCall) return { title: 'Phone' };
    if (consult) return { title: 'Consulting', chip: fmt(consultTimer) };
    const n = 2 + connectedParty.length;
    switch (callView) {
      case 'keypad':   return { title: 'On a call', banner: true };
      case 'details':  return { title: 'Phone', banner: true };
      case 'transfer': return { title: 'Transfer call', banner: true };
      case 'add':      return { title: 'Add to call', banner: true };
      case 'people':   return { title: `Conference call (${n})`, chip: fmt(callTimer) };
      default:
        if (ringingParty.length) return { title: 'On a call', chip: fmt(callTimer) };
        if (isConference) return { title: `Conference call (${n})`, chip: fmt(callTimer) };
        return { title: 'On a call', chip: fmt(callTimer) };
    }
  };

  const renderHeader = ({ title, chip }) => (
    <div className="sp-head">
      <div className="sp-head-left">
        <div className="sp-hbtn drag" onMouseDown={dragStart} onDoubleClick={resetDock} aria-hidden="true" title="Drag to move · double-click to reset"><Ico n="drag" /></div>
        <span id="sp-title" className="t-title-xs nowrap">{title}</span>
      </div>
      <div className="sp-head-right">
        {chip && <div className="sp-chip t-body-md" aria-label={`Call time ${chip}`}>{chip}</div>}
        <button className="sp-hbtn" title="Minimize (Esc)" aria-label="Minimize softphone" onClick={minimize}><Ico n="minimize" /></button>
        <button className="sp-hbtn" title="Open in new window" aria-label="Open softphone in new window" onClick={() => showToast('Opened in a new window')}><Ico n="popout" /></button>
        <button className="sp-hbtn" title="Close" aria-label="Close softphone" onClick={closePanel}><Ico n="close" /></button>
      </div>
    </div>
  );

  const renderBanner = () => (
    <div className="sp-banner" onClick={() => setCallView('main')} title="Back to call">
      <div className="sp-banner-left">
        <Ico n="banner-phone" />
        <div className="sp-vdiv" />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
          <Avatar p={caller} size={32} color={caller.unknown ? '#8D99AE' : '#007FAD'} />
          <span className="t-title-md ellipsis">{caller.name}</span>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span className="t-accent-md" style={{ fontVariantNumeric: 'tabular-nums' }}>{fmt(callTimer)}</span>
        <Ico n="chevron-right-white" />
      </div>
    </div>
  );

  // ─────────────────────────────────────────────────────────────
  // Idle tabs
  // ─────────────────────────────────────────────────────────────
  const renderKeypadTab = () => {
    const q = dialInput.trim().toLowerCase();
    const qd = digits(q);
    const matches = !q ? [] : CONTACTS.filter(c =>
      c.name.toLowerCase().includes(q) || (qd.length >= 3 && digits(c.listNumber).includes(qd))
    ).slice(0, 3);
    const dial = () => {
      if (!q) return;
      startCall(matches.length === 1 && !qd.length ? matches[0] : (matches[0] && qd.length >= 7 ? matches[0] : contactFromNumber(dialInput.trim())));
    };
    return (
      <div className="sp-main" style={{ padding: 20, alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="sp-field">
            <input value={dialInput} placeholder="Enter a name or number" autoFocus
              onChange={e => setDialInput(e.target.value)}
              onKeyDown={e => {
                if (e.key === 'Enter') dial();
              }} />
            {dialInput && <button className="sp-icon-btn" onClick={() => setDialInput('')} title="Clear"><Ico n="clear" /></button>}
          </div>
          {matches.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
              <span className="t-accent-sm">Matches</span>
              {matches.map(c => (
                <div key={c.id} onClick={() => startCall(c)}
                  style={{ display: 'flex', alignItems: 'center', padding: 4, borderRadius: 4, background: 'rgba(255,255,255,0.05)', cursor: 'pointer' }}>
                  <div className="sp-row-left">
                    <Avatar p={c} size={24} color="#B23C69" />
                    <div className="sp-col4">
                      <div className="sp-line">
                        <span className="t-title-xs">{c.name}</span>
                        <span className="t-body-sm">{c.company}</span>
                      </div>
                      <span className="t-body-sm" style={{ color: '#8D99AE' }}>{c.listNumber}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <Keypad onKey={k => setDialInput(v => v + k)}>
          <button className="sp-key call" style={{ gridColumn: 2 }} disabled={!q} onClick={dial} title="Call">
            <Ico n={q ? 'call-enabled' : 'call-disabled'} />
          </button>
        </Keypad>
      </div>
    );
  };

  const renderContactsTab = () => {
    if (viewContact) return renderContactDetails(viewContact, () => setViewContact(null), 'Back to contacts');
    const q = contactSearch.trim().toLowerCase();
    const list = CONTACTS.filter(c => !q || c.name.toLowerCase().includes(q) || c.company.toLowerCase().includes(q) || digits(c.listNumber).includes(digits(q) || '#'));
    return (
      <div className="sp-main" style={{ padding: 20, gap: list.length ? 20 : 24, alignItems: 'center', overflow: 'hidden' }}>
        <div className={`sp-search ${contactSearch ? 'filled' : ''}`}>
          <input value={contactSearch} placeholder="Search contacts" onChange={e => setContactSearch(e.target.value)} />
          {contactSearch
            ? <button className="sp-icon-btn" onClick={() => setContactSearch('')} title="Clear"><Ico n="clear" /></button>
            : <Ico n="search" />}
        </div>
        {list.length ? (
          <div className="sp-scroll" style={{ width: '100%', flex: 1 }}>
            <ListWithDividers items={list} trailing={false} render={c => (
              <div className="sp-row" style={{ cursor: 'pointer' }} onClick={() => setViewContact(c)}>
                <div className="sp-row-left">
                  <Avatar p={c} size={24} color="#B23C69" />
                  <div className="sp-col4">
                    <div className="sp-line">
                      <span className="t-title-xs">{c.name}</span>
                      <span className="t-body-sm" style={{ color: '#CED0D4' }}>{c.company}</span>
                    </div>
                    <span className="t-body-sm" style={{ color: '#8D99AE' }}>{c.listNumber}</span>
                  </div>
                </div>
                <button className="sp-row-call" title={`Call ${c.name}`} onClick={e => { e.stopPropagation(); startCall(c); }}><Ico n="row-call" /></button>
              </div>
            )} />
          </div>
        ) : (
          <div style={{ flex: '1 0 0', width: '100%', display: 'flex', flexDirection: 'column', gap: 24, alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: 306, display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center', textAlign: 'center' }}>
              <span className="t-body-md">No contacts match "{contactSearch}"</span>
              <span className="t-body-sm" style={{ color: '#8D99AE' }}>Check the spelling, or search by phone number</span>
